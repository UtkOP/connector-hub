/* ─── Shared atoms ─── */
function Btn({children,variant="dark",onClick,sx={},disabled}){
  const vs={dark:{background:"#111827",color:"#fff",border:"none"},outline:{background:C.bg,border:`1px solid ${C.grayB}`,color:C.t2},blue:{background:C.blue,color:"#fff",border:"none"},ghost:{background:"transparent",border:"none",color:C.t2}};
  return<button disabled={disabled} onClick={onClick} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,fontWeight:500,borderRadius:7,cursor:disabled?"not-allowed":"pointer",fontSize:13,padding:"7px 16px",transition:"opacity .12s",opacity:disabled?.5:1,...vs[variant],...sx}} onMouseEnter={e=>{if(!disabled)e.currentTarget.style.opacity=".85"}} onMouseLeave={e=>{if(!disabled)e.currentTarget.style.opacity="1"}}>{children}</button>;
}
function Inp({placeholder,type="text",sx={}}){return<input type={type} placeholder={placeholder} style={{width:"100%",padding:"7px 10px",border:`1px solid ${C.grayB}`,borderRadius:6,fontSize:13,color:C.text,background:C.bg,outline:"none",...sx}} onFocus={e=>{e.currentTarget.style.borderColor=C.blue;e.currentTarget.style.boxShadow=`0 0 0 3px ${C.blueL}`}} onBlur={e=>{e.currentTarget.style.borderColor=C.grayB;e.currentTarget.style.boxShadow="none"}}/>;}
function Sel({options,defaultValue,sx={}}){return<select defaultValue={defaultValue} style={{width:"100%",padding:"7px 10px",border:`1px solid ${C.grayB}`,borderRadius:6,fontSize:13,color:C.text,background:C.bg,outline:"none",cursor:"pointer",...sx}}>{options.map(o=><option key={o}>{o}</option>)}</select>;}

}

function HBar({d,maxVal,hov,onHover,onLeave}){
  const tw=maxVal>0?(d.total/maxVal)*100:0;
  const sw=d.total>0?(d.success/d.total)*tw:0;
  const fw=d.total>0?(d.failed/d.total)*tw:0;
  const isH=hov===d.label;
  return<div style={{display:"flex",alignItems:"center",gap:9,padding:"5px 0",opacity:hov&&!isH?.45:1,transition:"opacity .15s"}} onMouseEnter={()=>onHover(d)} onMouseLeave={onLeave}>
    <div style={{width:56,fontSize:11.5,fontWeight:500,color:C.t2,textAlign:"right",flexShrink:0}}>{d.short}</div>
    <div style={{flex:1,position:"relative",height:28,borderRadius:5,overflow:"hidden",background:C.bg2}}>
      {sw>0&&<div style={{position:"absolute",left:0,top:0,height:"100%",width:`${sw}%`,background:C.green,transition:"width .35s"}}/>}
      {fw>0&&<div style={{position:"absolute",left:`${sw}%`,top:0,height:"100%",width:`${fw}%`,background:C.red,transition:"width .35s"}}/>}
      {tw>18&&<div style={{position:"absolute",right:6,top:0,height:"100%",display:"flex",alignItems:"center",fontSize:10.5,color:"rgba(255,255,255,.9)",fontWeight:600}}>{fmtNum(d.total)}</div>}
    </div>
    <div style={{width:40,fontSize:11,color:C.t3,textAlign:"right",flexShrink:0}}>{fmtNum(d.total)}</div>
  </div>;
}
function AnalyticsView(){

  const seed=ASEED[cf]?.[dp]||ASEED.Email["7d"];

    <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"18px 20px"}}>

        <div style={{display:"flex",gap:4,alignItems:"center"}}><div style={{width:7,height:7,borderRadius:"50%",background:C.green}}/><span style={{color:"rgba(255,255,255,.6)"}}>Success</span><span style={{fontWeight:600,color:"#86efac",marginLeft:3}}>{tip.success.toLocaleString()} ({Math.round(tip.success/tip.total*100)}%)</span></div>

  // section: "connections" | "routing" | "analytics"
  const [page,setPage]=useState("connectra");
  const [section,setSection]=useState("connections");

  const TABS=[{key:"connections",label:"Connections"},{key:"routing",label:"Routing"},{key:"analytics",label:"Analytics"}];

  const handlePage=p=>{setPage(p);if(p==="notifications")setSection("connections");};
  const handleSection=s=>{setSection(s);};

  /* Breadcrumb text */
  const sectionLabel=TABS.find(t=>t.key===section)?.label||"";
  const bcParts=page==="notifications"?["Connectra","Notification",sectionLabel]:["Connectra"];

  return<div style={{display:"flex",height:"100vh",background:C.bg2,overflow:"hidden"}}>
    <Sidebar page={page} section={section} onPage={handlePage} onSection={handleSection}/>

    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>

      {/* ══ TOP CHROME — one unified band, no internal dividers ══
          Layout (top to bottom inside a single white bg block):
            Row 1: page title  (always visible)
            Row 2: toggle-button group  (only inside a domain)
            Row 3: breadcrumb  (only inside a domain)
          A single borderBottom sits at the bottom of the whole band.
      */}
      <div style={{background:C.bg,flexShrink:0,borderBottom:`1px solid ${C.border}`}}>

        {/* Row 1 — Title */}
        <div style={{display:"flex",alignItems:"center",padding:"0 20px",height:48}}>
          <span style={{fontSize:18,fontWeight:600,color:C.text}}>
            {page==="connectra"?"Connectra":"Notification"}
          </span>
        </div>

        {/* Row 2 — Toggle group (AML Alert Manager pill style) — no lines */}
        {page==="notifications"&&(
          <div style={{display:"flex",alignItems:"center",padding:"0 20px 10px",gap:2}}>
            <div style={{display:"inline-flex",background:C.bg2,border:`1px solid ${C.border}`,borderRadius:8,padding:3,gap:2}}>
              {TABS.map(t=>(
                <button key={t.key} onClick={()=>handleSection(t.key)}
                  style={{padding:"5px 18px",fontSize:13,border:"none",cursor:"pointer",borderRadius:6,
                    background:section===t.key?C.bg:"transparent",
                    color:section===t.key?C.blue:C.t2,
                    fontWeight:section===t.key?600:400,
                    boxShadow:section===t.key?"0 1px 3px rgba(0,0,0,.1)":"none",
                    transition:"all .12s"}}>
                  {t.label}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Row 3 — Breadcrumb (no border — the band's bottom border covers it) */}
        {page==="notifications"&&(
          <div style={{padding:"0 20px 8px",display:"flex",alignItems:"center",gap:6}}>
            {bcParts.map((p,i)=>(
              <React.Fragment key={p}>
                <span style={{fontSize:12,color:i===bcParts.length-1?C.text:C.t3,fontWeight:i===bcParts.length-1?500:400,cursor:i<bcParts.length-1?"pointer":"default"}}
                  onMouseEnter={e=>{if(i<bcParts.length-1)e.currentTarget.style.color=C.blue}}
                  onMouseLeave={e=>{if(i<bcParts.length-1)e.currentTarget.style.color=C.t3}}
                  onClick={()=>{if(i===0)handlePage("connectra");}}>
                  {p}
                </span>
                {i<bcParts.length-1&&<span style={{color:C.t3,fontSize:11}}>›</span>}
              </React.Fragment>
            ))}
          </div>
        )}
      </div>

      {/* ── CONTENT ── */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {page==="connectra"&&<ConnectraHome onEnterDomain={d=>{handlePage(d==="notifications"?"notifications":d);}}/>}
        {page==="notifications"&&(
          <>
            {section==="connections"&&<ConnectionsView/>}
            {section==="routing"&&<RoutingView/>}
            {section==="analytics"&&<AnalyticsView/>}
          </>
        )}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
